name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    # Keys are NOT written into the site. WooCommerce and Katana keys live
    # only in the Miss-Woo API (Cloudflare Worker); src/config.js holds no secrets.
    - name: Check that no keys are published
      run: |
        if grep -rEn "(ck|cs)_[0-9a-f]{30,}|Bearer [A-Za-z0-9]{20,}" src/ index.html index-web.html integrations/; then
          echo "::error::Something that looks like an API key is in the files to be published."
          exit 1
        fi

    - name: Create production build
      run: |
        mkdir -p dist
        cp index.html dist/
        cp index-web.html dist/
        cp -r src dist/
        mkdir -p dist/integrations/missive-js
        cp integrations/missive-js/app.js dist/integrations/missive-js/
        mkdir -p dist/worker
        cp worker/parse-sales-worker.js dist/worker/ 2>/dev/null || echo "⚠️ worker/parse-sales-worker.js not found, skipping..."
        # Copy sales export data file for historical orders
        cp sales_export_filtered.json dist/ 2>/dev/null || echo "⚠️ sales_export_filtered.json not found, skipping..."
        BUILD_VERSION=$(date +%Y%m%d%H%M%S)  # cache-busting only
        DISPLAY_VERSION=${GITHUB_SHA::7}     # human-readable version
        # Update cache-busting version in HTML references (keep timestamps here)
        sed -E -i "s/\?v=[0-9]+/\?v=${BUILD_VERSION}/g" dist/index.html
        sed -E -i "s/\?v=[0-9]+/\?v=${BUILD_VERSION}/g" dist/index-web.html
        # Update displayed version in app header to short SHA with GH prefix (legacy)
        sed -E -i "s/return 'v[0-9]+';/return 'GH-${DISPLAY_VERSION}';/g" dist/src/app.js || true
        # Write manifest with short SHA for all clients
        echo "{\"version\": \"${DISPLAY_VERSION}\", \"commit\": \"$GITHUB_SHA\"}" > dist/version.json

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4